server.port=8085

spring.application.name=snkrlab-ms-ordenes

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3309/snkrlab_orders_db?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=${AZURE_ISSUER_URI:https://login.microsoftonline.com/}
spring.security.oauth2.resourceserver.jwt.tenant-id=${AZURE_TENANT_ID:db9d1cc0-8c32-4341-bc72-c348daf096fb}

ordenes.internal-key=${ORDENES_INTERNAL_KEY:snkrlab-local-ordenes}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}